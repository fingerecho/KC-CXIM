plugins {
    id 'com.android.application'
}

/*
 * release 签名配置。
 *
 * 为什么要在外面读文件：
 *   assembleRelease 在没有 signingConfig 时产出的是 app-release-unsigned.apk，
 *   完全未签名的包系统在安装阶段的解析环节就拒了，真机上表现为「软件包似乎无效」。
 *   （Android 11+ 还要求必须有 v2 APK Signing Block，只补 v1 jar 签名同样是这个报错，
 *    所以下面 v1/v2 都显式打开。）
 *
 * keystore.properties 放在项目根，不入库（见 .gitignore）；
 * 缺这个文件时 release 仍然照常构建成未签名包，不让别人的 clone 直接构建失败。
 */
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def storeFilePath = keystoreProps.getProperty('storeFile')?.trim()
def hasReleaseSigning = storeFilePath != null && !storeFilePath.isEmpty()

android {
    namespace 'com.example.helloworld'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.helloworld"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            cximRelease {
                storeFile rootProject.file(storeFilePath)
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
                // 这两个开关只是提示，AGP 8 实际按 minSdk 推导：
                // minSdk 24 起所有设备都支持 APK Signature Scheme v2，
                // 所以产物是 v2 有、v1 无（实测 apksigner: v1=false, v2=true），这是对的。
                // 关键点是必须有 v2 —— Android 11+ 装 targetSdk 30+ 的包时缺 v2 会直接报
                // 「软件包似乎无效」。将来若把 minSdk 降到 24 以下，需要 v1 兜底。
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.cximRelease
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

if (!hasReleaseSigning) {
    logger.warn("[CXIM] 未找到 keystore.properties（或缺 storeFile），"
            + "release 会产出未签名包 app-release-unsigned.apk，"
            + "真机安装会报「软件包似乎无效」")
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    // OkHttp：服务端 /api/friends/{id} 与 /api/groups/{id} 使用 PATCH，
    // HttpURLConnection 不支持该方法
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
