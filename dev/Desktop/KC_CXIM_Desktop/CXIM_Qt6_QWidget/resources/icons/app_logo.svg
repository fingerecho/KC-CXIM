<?xml version="1.0" encoding="UTF-8"?>
<!--
    铖信应用 logo(矢量版)
    与 src/ui/login/loginwindow.cpp 的 brandLogoPixmap() 自绘口径一致:
      白色圆盘 → 直径 0.54×D 的品牌蓝渐变圆 → 旋转 -45° 的两个交叠圆角环(链环)
    环的尺寸按自绘代码的比例换算(视口 D=96):
      inner = 51.8   w = inner×0.42 = 21.8   h = inner×0.24 = 12.4
      off   = inner×0.15 = 7.8              stroke = inner×0.12 = 6.2
-->
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ab3f0"/>
      <stop offset="1" stop-color="#3f95dd"/>
    </linearGradient>
  </defs>

  <!-- 白色圆盘 -->
  <circle cx="48" cy="48" r="48" fill="#ffffff"/>

  <!-- 品牌蓝圆 -->
  <circle cx="48" cy="48" r="25.9" fill="url(#brand)"/>

  <!-- 链环: 两个交叠的圆角环, 整体绕圆心旋转 -45° -->
  <g transform="rotate(-45 48 48)" fill="none" stroke="#ffffff"
     stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="29.3" y="41.8" width="21.8" height="12.4" rx="6.2"/>
    <rect x="44.9" y="41.8" width="21.8" height="12.4" rx="6.2"/>
  </g>
</svg>
